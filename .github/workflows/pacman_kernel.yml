name: Pacman Kernel (NothingOSS source) - SukiSU Ultra + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 python3 python-is-python3 \
            zip zstd rsync ccache
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync GKI build environment (android13-5.15)
        run: |
          mkdir android-kernel && cd android-kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b common-android13-5.15 --repo-rev=v2.16
          repo sync -c -j$(nproc) --no-tags --fail-fast --force-sync
          echo "=== build harness contents ==="
          ls -la
          ls build/ 2>/dev/null && echo "build.sh present: $([ -f build/build.sh ] && echo yes || echo NO-bazel-only)"
          ls prebuilts/clang/host/linux-x86/ 2>/dev/null | head

      - name: Swap in NothingOSS source as common/
        run: |
          cd android-kernel
          rm -rf common
          git clone --depth=1 -b mt6886/Pacman/16b \
            https://github.com/raredogecreator-cloud/android_kernel_5.15_nothing_mt6886.git common
          echo "NothingOSS source in place. Verify nothing symbol list:"
          ls common/android/abi_gki_aarch64_nothing 2>/dev/null && echo "nothing KMI list present" || echo "WARN: no nothing KMI list"

      - name: Integrate SukiSU Ultra (builtin = susfs-enabled Kconfig)
        run: |
          cd android-kernel/common
          # 'builtin' branch carries the CONFIG_KSU_SUSFS Kconfig symbols (main does NOT)
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          echo "SukiSU Ultra version:"
          cat KernelSU*/kernel/Makefile 2>/dev/null | grep -i version | head || true

      - name: Integrate SUSFS (gki-android13-5.15)
        run: |
          cd android-kernel
          git clone --depth=1 https://github.com/ShirkNeko/susfs4ksu.git -b gki-android13-5.15 susfs4ksu
          cd common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          echo "=== available susfs kernel patches ==="
          ls ../susfs4ksu/kernel_patches/
          # Apply the main kernel-side SUSFS patch
          PATCH=$(ls ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch 2>/dev/null || ls ../susfs4ksu/kernel_patches/50_add_susfs*.patch | head -1)
          echo "Applying $PATCH"
          patch -p1 < "$PATCH" || echo "WARN: susfs patch had rejects (continuing - SukiSU may carry builtin susfs)"

      - name: Stealth fixes (v2 â€” /proc/version, dmesg, config.gz)
        run: |
          cd android-kernel/common
          # Kill setlocalversion entirely â€” we hardcode LOCALVERSION in defconfig
          printf '#!/bin/sh\nexit 0\n' > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "setlocalversion replaced with no-op"
          cat scripts/setlocalversion
          # Also patch kleaf stamp.bzl if present (bazel builds)
          if [ -f ../build/kernel/kleaf/impl/stamp.bzl ]; then
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ../build/kernel/kleaf/impl/stamp.bzl
          fi
          # Force timestamp into Makefile top-level so build.sh can't override
          echo 'export KBUILD_BUILD_TIMESTAMP=Tue Sep 16 15:52:19 UTC 2025' >> ../build.config.constants
          echo 'export KBUILD_BUILD_VERSION=1' >> ../build.config.constants
          # Also inject directly into the kernel Makefile as fallback
          sed -i 's|^KBUILD_BUILD_TIMESTAMP ?=.*|KBUILD_BUILD_TIMESTAMP = Tue Sep 16 15:52:19 UTC 2025|' Makefile 2>/dev/null || true

      - name: Verify build config + KSU/SUSFS fragment present
        run: |
          cd android-kernel/common
          echo "=== build config ==="; cat build.config.pacman_ksu
          echo "=== ksu fragment ==="; cat arch/arm64/configs/ksu_susfs.config
          echo "=== setlocalversion ==="; cat scripts/setlocalversion

      - name: Build kernel
        env:
          KBUILD_BUILD_TIMESTAMP: "Tue Sep 16 15:52:19 UTC 2025"
          KBUILD_BUILD_VERSION: "1"
          SOURCE_DATE_EPOCH: "1758117139"
        run: |
          cd android-kernel
          export LTO=thin
          export KBUILD_BUILD_TIMESTAMP="Tue Sep 16 15:52:19 UTC 2025"
          export KBUILD_BUILD_VERSION=1
          export SOURCE_DATE_EPOCH=1758117139
          export BUILD_CONFIG=common/build.config.pacman_ksu
          # build.sh fails at modules_install because we build NO modules
          # (vendor modules stay stock on device â€” GKI stable KMI). The kernel
          # Image.lz4 is produced BEFORE that step, so capture it regardless.
          build/build.sh || echo "build.sh non-zero (expected: modules_install â€” we only need Image.lz4)"
          IMG=$(find out -name 'Image.lz4' | head -1)
          if [ -z "$IMG" ]; then echo "ERROR: Image.lz4 not produced â€” real build failure"; exit 1; fi
          echo "Kernel image built: $IMG"
          mkdir -p dist
          cp "$IMG" dist/Image.lz4
          find out -name 'mt6886.dtb' -exec cp {} dist/ \; 2>/dev/null || true
          find out -name 'k6886v1_64*.dtbo' -exec cp {} dist/ \; 2>/dev/null || true
          # capture built .config + Module.symvers for pre-flash KMI verification
          CONF=$(find out -name '.config' | head -1)
          cp "$CONF" dist/kernel_built_config 2>/dev/null || true
          find out -name 'Module.symvers' -exec cp {} dist/ \; 2>/dev/null || true
          echo "===== KMI / MODULE VERIFICATION ====="
          echo "--- CONFIG_MODULES / MODVERSIONS ---"
          grep -E '^CONFIG_MODULES=|^CONFIG_MODVERSIONS=|^CONFIG_MODULE_SIG' "$CONF" || true
          echo "--- count of =m modules configured ---"
          grep -c '=m$' "$CONF" || true
          echo "--- CONFIG_LOCALVERSION ---"
          grep -E '^CONFIG_LOCALVERSION' "$CONF" || true
          echo "--- KSU/SUSFS confirmed in built config ---"
          grep -E '^CONFIG_KSU|^CONFIG_KSU_SUSFS' "$CONF" || true
          echo "===================================="
          echo "=== dist contents ==="
          ls -la dist/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacman-nothingoss-kernel
          path: android-kernel/dist/*
          retention-days: 7
          if-no-files-found: error
