name: Pacman Kernel (NothingOSS source) - SukiSU Ultra + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 python3 python-is-python3 \
            zip zstd rsync ccache
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync GKI build environment (android13-5.15)
        run: |
          mkdir android-kernel && cd android-kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b common-android13-5.15 --repo-rev=v2.16
          repo sync -c -j$(nproc) --no-tags --fail-fast --force-sync
          echo "=== build harness contents ==="
          ls -la
          ls build/ 2>/dev/null && echo "build.sh present: $([ -f build/build.sh ] && echo yes || echo NO-bazel-only)"
          ls prebuilts/clang/host/linux-x86/ 2>/dev/null | head

      - name: Swap in NothingOSS source as common/
        run: |
          cd android-kernel
          rm -rf common
          git clone --depth=1 -b mt6886/Pacman/16b \
            https://github.com/raredogecreator-cloud/android_kernel_5.15_nothing_mt6886.git common
          echo "NothingOSS source in place. Verify nothing symbol list:"
          ls common/android/abi_gki_aarch64_nothing 2>/dev/null && echo "nothing KMI list present" || echo "WARN: no nothing KMI list"

      - name: Integrate SukiSU Ultra (builtin = susfs-enabled Kconfig)
        run: |
          cd android-kernel/common
          # 'builtin' branch carries the CONFIG_KSU_SUSFS Kconfig symbols (main does NOT)
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          echo "SukiSU Ultra version:"
          cat KernelSU*/kernel/Makefile 2>/dev/null | grep -i version | head || true

      - name: Integrate SUSFS (gki-android13-5.15)
        run: |
          cd android-kernel
          git clone --depth=1 https://github.com/ShirkNeko/susfs4ksu.git -b gki-android13-5.15 susfs4ksu
          cd common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          echo "=== available susfs kernel patches ==="
          ls ../susfs4ksu/kernel_patches/
          # Apply the main kernel-side SUSFS patch
          PATCH=$(ls ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch 2>/dev/null || ls ../susfs4ksu/kernel_patches/50_add_susfs*.patch | head -1)
          echo "Applying $PATCH"
          patch -p1 < "$PATCH" || echo "WARN: susfs patch had rejects (continuing - SukiSU may carry builtin susfs)"

      - name: Stealth patches (v4)
        run: |
          cd android-kernel/common
          printf '#!/bin/sh\necho "-android13-8-00004-g1c3825f8ac0a-ab14110541"\n' > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "setlocalversion:"; sh scripts/setlocalversion
          sed -i '/#include <linux\/kernel.h>/a\#include <linux\/cred.h>' kernel/kallsyms.c
          python3 -c "
          f=open('kernel/kallsyms.c');s=f.read();f.close()
          o=chr(9)+'if (!iter->name[0])'+chr(10)+chr(9)+chr(9)+'return 0;'
          n=o+chr(10)+chr(10)+chr(9)+'/* Hide KSU/SUSFS symbols from apps */'+chr(10)+chr(9)+'if (current_uid().val >= 10000) {'+chr(10)+chr(9)+chr(9)+'if (strstr(iter->name, '+chr(34)+'ksu_'+chr(34)+') || strstr(iter->name, '+chr(34)+'susfs_'+chr(34)+') || strstr(iter->name, '+chr(34)+'_kpm'+chr(34)+'))'+chr(10)+chr(9)+chr(9)+chr(9)+'return 0;'+chr(10)+chr(9)+'}'
          f=open('kernel/kallsyms.c','w');f.write(s.replace(o,n,1));f.close()
          print('kallsyms patched')
          "
          grep -B2 -A10 "Hide KSU" kernel/kallsyms.c
          # v8: VFS stealth --- /data/adb AND ALL descendants return ENOENT (infinite depth prefix match)
          echo "" | base64 -d > /tmp/patch_vfs.py
          python3 /tmp/patch_vfs.py
          grep -c susfs_is_stealth_path fs/namei.c fs/open.c
          # v6: Sanitize IKCONFIG - /proc/config.gz shows clean config (no CONFIG_KSU)
          echo "" | base64 -d > /tmp/patch_ikconfig.py
          python3 /tmp/patch_ikconfig.py
          grep -A3 "stealth_config" kernel/Makefile
          # v9.4: DirtySepolicy cloak (RELEASE) --- reduced blocklist: su_exec/lsposed_file/zygisk_file only
          # :ksu: and :ksu_file: removed — they break Manager RootService bootstrap (ClassNotFoundException)
          echo "" | base64 -d > /tmp/patch_dirtysepolicy.py
          python3 /tmp/patch_dirtysepolicy.py
          # CI safety checks
          grep -n "linux/cred.h" security/selinux/ss/services.c || { echo "ERROR: cred.h missing"; exit 1; }
          COUNT=$(grep -c "DirtySepolicy Cloak" security/selinux/ss/services.c)
          [ "$COUNT" = "1" ] || { echo "ERROR: expected 1 DirtySepolicy block, got $COUNT"; exit 1; }
          grep -n "security_context_to_sid_core" security/selinux/ss/services.c

      - name: Verify build config + KSU/SUSFS fragment present
        run: |
          cd android-kernel/common
          echo "=== build config ==="; cat build.config.pacman_ksu
          echo "=== ksu fragment ==="; cat arch/arm64/configs/ksu_susfs.config

      - name: Build kernel
        run: |
          cd android-kernel
          export LTO=thin
          export SOURCE_DATE_EPOCH=1758037939
          export BUILD_CONFIG=common/build.config.pacman_ksu
          # build.sh fails at modules_install because we build NO modules
          # (vendor modules stay stock on device -------- GKI stable KMI). The kernel
          # Image.lz4 is produced BEFORE that step, so capture it regardless.
          build/build.sh || echo "build.sh non-zero (expected: modules_install -------- we only need Image.lz4)"
          IMG=$(find out -name 'Image.lz4' | head -1)
          if [ -z "$IMG" ]; then echo "ERROR: Image.lz4 not produced -------- real build failure"; exit 1; fi
          echo "Kernel image built: $IMG"
          mkdir -p dist
          cp "$IMG" dist/Image.lz4
          find out -name 'mt6886.dtb' -exec cp {} dist/ \; 2>/dev/null || true
          find out -name 'k6886v1_64*.dtbo' -exec cp {} dist/ \; 2>/dev/null || true
          # capture built .config + Module.symvers for pre-flash KMI verification
          CONF=$(find out -name '.config' | head -1)
          cp "$CONF" dist/kernel_built_config 2>/dev/null || true
          find out -name 'Module.symvers' -exec cp {} dist/ \; 2>/dev/null || true
          echo "===== KMI / MODULE VERIFICATION ====="
          echo "--- CONFIG_MODULES / MODVERSIONS ---"
          grep -E '^CONFIG_MODULES=|^CONFIG_MODVERSIONS=|^CONFIG_MODULE_SIG' "$CONF" || true
          echo "--- count of =m modules configured ---"
          grep -c '=m$' "$CONF" || true
          echo "--- CONFIG_LOCALVERSION ---"
          grep -E '^CONFIG_LOCALVERSION' "$CONF" || true
          echo "--- KSU/SUSFS confirmed in built config ---"
          grep -E '^CONFIG_KSU|^CONFIG_KSU_SUSFS' "$CONF" || true
          echo "===================================="
          echo "=== dist contents ==="
          ls -la dist/

      - name: Inject KernelPatch KPM runtime into Image
        run: |
          cd android-kernel
          PATCHDIR="$PWD/kpm_patch_work"
          rm -rf "$PATCHDIR"
          mkdir -p "$PATCHDIR"
          cp dist/Image.lz4 "$PATCHDIR/Image.lz4"
          cd "$PATCHDIR"
          lz4 -d Image.lz4 Image || { echo "ERROR: lz4 decompress failed"; exit 1; }
          echo "Raw Image size: $(stat -c%s Image)"
          git clone --depth 1 https://github.com/ShirkNeko/SukiSU_patch.git sukisu_patch
          cp sukisu_patch/kpm/patch_linux .
          chmod +x patch_linux
          file patch_linux
          ./patch_linux || { echo "ERROR: patch_linux failed"; exit 1; }
          [ -f oImage ] || { echo "ERROR: oImage not produced"; exit 1; }
          echo "Patched Image size: $(stat -c%s oImage)"
          mv oImage Image
          lz4 -f -12 --favor-decSpeed Image Image.lz4 || { echo "ERROR: lz4 recompress failed"; exit 1; }
          cp Image.lz4 "$GITHUB_WORKSPACE/android-kernel/dist/Image.lz4"
          echo "KPM injection complete"
          ls -la "$GITHUB_WORKSPACE/android-kernel/dist/"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacman-nothingoss-kernel
          path: android-kernel/dist/*
          retention-days: 7
          if-no-files-found: error
