name: Pacman Kernel (NothingOSS source) - SukiSU Ultra + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 python3 python-is-python3 \
            zip zstd rsync ccache
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync GKI build environment (android13-5.15)
        run: |
          mkdir android-kernel && cd android-kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b common-android13-5.15 --repo-rev=v2.16
          repo sync -c -j$(nproc) --no-tags --fail-fast --force-sync
          echo "=== build harness contents ==="
          ls -la
          ls build/ 2>/dev/null && echo "build.sh present: $([ -f build/build.sh ] && echo yes || echo NO-bazel-only)"
          ls prebuilts/clang/host/linux-x86/ 2>/dev/null | head

      - name: Swap in NothingOSS source as common/
        run: |
          cd android-kernel
          rm -rf common
          git clone --depth=1 -b mt6886/Pacman/16b \
            https://github.com/raredogecreator-cloud/android_kernel_5.15_nothing_mt6886.git common
          echo "NothingOSS source in place. Verify nothing symbol list:"
          ls common/android/abi_gki_aarch64_nothing 2>/dev/null && echo "nothing KMI list present" || echo "WARN: no nothing KMI list"

      - name: Integrate SukiSU Ultra (builtin = susfs-enabled Kconfig)
        run: |
          cd android-kernel/common
          # 'builtin' branch carries the CONFIG_KSU_SUSFS Kconfig symbols (main does NOT)
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          echo "SukiSU Ultra version:"
          cat KernelSU*/kernel/Makefile 2>/dev/null | grep -i version | head || true

      - name: Integrate SUSFS (gki-android13-5.15)
        run: |
          cd android-kernel
          git clone --depth=1 https://github.com/ShirkNeko/susfs4ksu.git -b gki-android13-5.15 susfs4ksu
          cd common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          echo "=== available susfs kernel patches ==="
          ls ../susfs4ksu/kernel_patches/
          # Apply the main kernel-side SUSFS patch
          PATCH=$(ls ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch 2>/dev/null || ls ../susfs4ksu/kernel_patches/50_add_susfs*.patch | head -1)
          echo "Applying $PATCH"
          patch -p1 < "$PATCH" || echo "WARN: susfs patch had rejects (continuing - SukiSU may carry builtin susfs)"

      - name: Stealth patches (v4)
        run: |
          cd android-kernel/common
          printf '#!/bin/sh\necho "-android13-8-00004-g1c3825f8ac0a-ab14110541"\n' > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "setlocalversion:"; sh scripts/setlocalversion
          sed -i '/#include <linux\/kernel.h>/a\#include <linux\/cred.h>' kernel/kallsyms.c
          python3 -c "
          f=open('kernel/kallsyms.c');s=f.read();f.close()
          o=chr(9)+'if (!iter->name[0])'+chr(10)+chr(9)+chr(9)+'return 0;'
          n=o+chr(10)+chr(10)+chr(9)+'/* Hide KSU/SUSFS symbols from apps */'+chr(10)+chr(9)+'if (current_uid().val >= 10000) {'+chr(10)+chr(9)+chr(9)+'if (strstr(iter->name, '+chr(34)+'ksu_'+chr(34)+') || strstr(iter->name, '+chr(34)+'susfs_'+chr(34)+'))'+chr(10)+chr(9)+chr(9)+chr(9)+'return 0;'+chr(10)+chr(9)+'}'
          f=open('kernel/kallsyms.c','w');f.write(s.replace(o,n,1));f.close()
          print('kallsyms patched')
          "
          grep -B2 -A10 "Hide KSU" kernel/kallsyms.c
          # v5: VFS stealth — /data/adb/* returns ENOENT for apps
          cat > /tmp/patch_vfs_stealth.py << 'VFSPATCH'
import sys

HELPER = """
/* SukiSU VFS Cloak: return -ENOENT for root-related paths (UID >= 10000) */
static bool susfs_is_stealth_path(const char *in) {
    char clean[128];
    char buf[128];
    char *segments[16];
    int seg_count = 0;
    char *p = buf;
    char *token;
    int i, out_idx;
    if (!in || in[0] != '/' || strncmp(in, "/data/adb/", 10) != 0)
        return false;
    if (strscpy(buf, in, sizeof(buf)) < 0)
        return false;
    while ((token = strsep(&p, "/")) != NULL) {
        if (*token == '\\0' || strcmp(token, ".") == 0)
            continue;
        if (strcmp(token, "..") == 0) {
            if (seg_count > 0) seg_count--;
            continue;
        }
        if (seg_count < 16)
            segments[seg_count++] = token;
        else
            return false;
    }
    out_idx = 0;
    clean[out_idx++] = '/';
    for (i = 0; i < seg_count; i++) {
        int len = strlen(segments[i]);
        if (out_idx + len + 1 >= (int)sizeof(clean)) return false;
        memcpy(clean + out_idx, segments[i], len);
        out_idx += len;
        if (i < seg_count - 1)
            clean[out_idx++] = '/';
    }
    clean[out_idx] = '\\0';
    return (strcmp(clean, "/data/adb/ksu") == 0 ||
            strcmp(clean, "/data/adb/ksud") == 0 ||
            strcmp(clean, "/data/adb/modules") == 0 ||
            strcmp(clean, "/data/adb/lspd") == 0);
}
"""

def patch_namei():
    with open("fs/namei.c") as f: s = f.read()
    if "linux/cred.h" not in s:
        s = s.replace("#include <linux/uaccess.h>", "#include <linux/uaccess.h>\n#include <linux/cred.h>\n#include <linux/string.h>")
    if "susfs_is_stealth_path" not in s:
        s = s.replace("int user_path_at_empty(int dfd,", HELPER + "\nint user_path_at_empty(int dfd,")
    old = "\tstruct filename *filename = getname_flags(name, flags, empty);\n\tint ret = filename_lookup(dfd, filename, flags, path, NULL);\n\n\tputname(filename);\n\treturn ret;"
    new = "\tstruct filename *filename = getname_flags(name, flags, empty);\n\tint ret;\n\n\tif (!IS_ERR(filename) && current_uid().val >= 10000 && filename->name) {\n\t\tif (susfs_is_stealth_path(filename->name)) {\n\t\t\tputname(filename);\n\t\t\treturn -ENOENT;\n\t\t}\n\t}\n\n\tret = filename_lookup(dfd, filename, flags, path, NULL);\n\tputname(filename);\n\treturn ret;"
    if old in s:
        s = s.replace(old, new, 1)
        print("namei.c patched OK")
    else:
        print("namei.c MATCH FAILED"); sys.exit(1)
    with open("fs/namei.c", "w") as f: f.write(s)

def patch_open():
    with open("fs/open.c") as f: s = f.read()
    if "linux/cred.h" not in s:
        s = s.replace("#include <linux/string.h>", "#include <linux/string.h>\n#include <linux/cred.h>")
    if "susfs_is_stealth_path" not in s:
        s = s.replace("static long do_sys_openat2(int dfd,", HELPER + "\nstatic long do_sys_openat2(int dfd,")
    old = "\ttmp = getname(filename);\n\tif (IS_ERR(tmp))\n\t\treturn PTR_ERR(tmp);\n\n\tfd = get_unused_fd_flags(how->flags);"
    new = "\ttmp = getname(filename);\n\tif (IS_ERR(tmp))\n\t\treturn PTR_ERR(tmp);\n\n\tif (current_uid().val >= 10000 && tmp->name) {\n\t\tif (susfs_is_stealth_path(tmp->name)) {\n\t\t\tputname(tmp);\n\t\t\treturn -ENOENT;\n\t\t}\n\t}\n\n\tfd = get_unused_fd_flags(how->flags);"
    if old in s:
        s = s.replace(old, new, 1)
        print("open.c patched OK")
    else:
        print("open.c MATCH FAILED"); sys.exit(1)
    with open("fs/open.c", "w") as f: f.write(s)

patch_namei()
patch_open()
print("VFS stealth patch complete")
VFSPATCH
          python3 /tmp/patch_vfs_stealth.py
          echo "=== Verify namei.c patch ==="
          grep -c "susfs_is_stealth_path" fs/namei.c
          echo "=== Verify open.c patch ==="
          grep -c "susfs_is_stealth_path" fs/open.c

      - name: Verify build config + KSU/SUSFS fragment present
        run: |
          cd android-kernel/common
          echo "=== build config ==="; cat build.config.pacman_ksu
          echo "=== ksu fragment ==="; cat arch/arm64/configs/ksu_susfs.config

      - name: Build kernel
        run: |
          cd android-kernel
          export LTO=thin
          export SOURCE_DATE_EPOCH=1758037939
          export BUILD_CONFIG=common/build.config.pacman_ksu
          # build.sh fails at modules_install because we build NO modules
          # (vendor modules stay stock on device â€” GKI stable KMI). The kernel
          # Image.lz4 is produced BEFORE that step, so capture it regardless.
          build/build.sh || echo "build.sh non-zero (expected: modules_install â€” we only need Image.lz4)"
          IMG=$(find out -name 'Image.lz4' | head -1)
          if [ -z "$IMG" ]; then echo "ERROR: Image.lz4 not produced â€” real build failure"; exit 1; fi
          echo "Kernel image built: $IMG"
          mkdir -p dist
          cp "$IMG" dist/Image.lz4
          find out -name 'mt6886.dtb' -exec cp {} dist/ \; 2>/dev/null || true
          find out -name 'k6886v1_64*.dtbo' -exec cp {} dist/ \; 2>/dev/null || true
          # capture built .config + Module.symvers for pre-flash KMI verification
          CONF=$(find out -name '.config' | head -1)
          cp "$CONF" dist/kernel_built_config 2>/dev/null || true
          find out -name 'Module.symvers' -exec cp {} dist/ \; 2>/dev/null || true
          echo "===== KMI / MODULE VERIFICATION ====="
          echo "--- CONFIG_MODULES / MODVERSIONS ---"
          grep -E '^CONFIG_MODULES=|^CONFIG_MODVERSIONS=|^CONFIG_MODULE_SIG' "$CONF" || true
          echo "--- count of =m modules configured ---"
          grep -c '=m$' "$CONF" || true
          echo "--- CONFIG_LOCALVERSION ---"
          grep -E '^CONFIG_LOCALVERSION' "$CONF" || true
          echo "--- KSU/SUSFS confirmed in built config ---"
          grep -E '^CONFIG_KSU|^CONFIG_KSU_SUSFS' "$CONF" || true
          echo "===================================="
          echo "=== dist contents ==="
          ls -la dist/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacman-nothingoss-kernel
          path: android-kernel/dist/*
          retention-days: 7
          if-no-files-found: error
